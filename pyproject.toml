[tool.poetry]
name = "energy-cross-commodity"
version = "0.1.0"
description = "Cross-commodity energy trading analytics platform"
authors = ["wididestrianda01"]
readme = "README.md"
packages = [{include = "energy_cross_commodity", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
duckdb = "^1.0"
pandas = "^2.2"
numpy = "^2.0"
arch = "^7.0"
scipy = "^1.14"
streamlit = "^1.38"
plotly = "^5.23"
hydra-core = "^1.3"
omegaconf = "^2.3"
yfinance = "^0.2"
python-dotenv = "^1.0"
xarray = "^2026.7.0"
statsmodels = "^0.14"
entsoe-py = "^0.8"
carbon-ets = "^0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.5"
nbformat = "^5.10.4"
nbconvert = {extras = ["webpdf"], version = "^7.17.1"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
markers = [
    "slow: slow tests (model fitting, copula MLE)",
    "unit: fast unit tests",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
