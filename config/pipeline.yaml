data:
  start_date: "2019-01-01"
  end_date: null
  db_path: "energy_data.db"

commodities:
  BRENT:
    ticker: "BZ=F"
    source: "yfinance"
    mwh_per_unit: 1.628
  TTF:
    ticker: "TTF=F"
    source: "yfinance"
    mwh_per_unit: 1.0
  EUA:
    ticker: null
    source: "carbon_ets"
    mwh_per_unit: null
  DE_POWER:
    ticker: null
    bidding_zone: "DE_LU"
    source: "entsoe"
    mwh_per_unit: 1.0
  NO1_POWER:
    ticker: null
    bidding_zone: "NO_1"
    source: "entsoe"
    mwh_per_unit: 1.0
  RBOB:
    ticker: "RB=F"
    source: "yfinance"
    mwh_per_unit: null
  GASOIL:
    ticker: "GOC=F"
    source: "yfinance"
    mwh_per_unit: null
  API2:
    ticker: "MTF=F"
    source: "yfinance"
    # API2 CIF ARA is quoted against a 6,000 kcal/kg NAR specification:
    # 6,000 kcal/kg = 6.978 MWh/tonne. (8.141 MWh/t would be tonne-of-coal-
    # equivalent at 7,000 kcal/kg, which is not the API2 contract spec.)
    mwh_per_unit: 6.978
  EURUSD:
    ticker: "EURUSD=X"
    source: "yfinance"
    mwh_per_unit: null

spreads:
  spark:
    efficiency: 0.55
    emission_factor: 0.37
  dark:
    efficiency: 0.38
    emission_factor: 0.90
  crack:
    ratio: [2, 1, 3]
    # Legs are quoted in different units and must be converted to USD/bbl
    # before the 2:1:3 ratio is applied.
    rbob_gal_per_bbl: 42.0        # RBOB USD/gal x 42 -> USD/bbl
    gasoil_bbl_per_tonne: 7.45    # ICE Gasoil USD/tonne / 7.45 -> USD/bbl

risk:
  confidence: [0.95, 0.99]
  es_confidence: 0.975
  n_simulations: 10000
  dcc_p: 1
  dcc_q: 1
  rolling_window: 60

portfolio:
  positions:
    BRENT: {notional_eur: 9200000, direction: "LONG"}
    CRACK_3_2_1: {notional_eur: -4600000, direction: "SHORT"}
    TTF: {notional_eur: 8000000, direction: "LONG"}
    SPARK_SPREAD: {notional_eur: -4000000, direction: "SHORT"}
    EUA: {notional_eur: 3000000, direction: "LONG"}

scenarios:
  gas_crisis:
    active: true
    description: "Nord Stream Zero"
    shocks:
      TTF: 3.00
      DE_POWER: 2.00
      EUA: 0.50
      BRENT: 0.30
      RBOB: 0.20
      GASOIL: 0.25
      API2: 1.00
  recession:
    active: true
    description: "Global Recession"
    shocks:
      BRENT: -0.40
      TTF: -0.30
      DE_POWER: -0.25
      EUA: -0.20
      RBOB: -0.45
      GASOIL: -0.40
      API2: -0.35
  energy_transition:
    active: true
    description: "Energy Transition Accelerates"
    shocks:
      EUA: 2.00
      API2: -0.40
      BRENT: -0.30
      DE_POWER: -0.10
      TTF: -0.20
      RBOB: -0.35
      GASOIL: -0.35
