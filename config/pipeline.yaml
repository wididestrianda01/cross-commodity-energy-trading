data:
  # 2020 is the earliest year EEX publishes EUA auction reports for; an earlier
  # start would leave carbon missing from the common-date panel anyway.
  start_date: "2020-01-01"
  end_date: null
  db_path: "energy_data.db"

commodities:
  BRENT:
    ticker: "BZ=F"
    source: "yfinance"
    mwh_per_unit: 1.628
  TTF:
    ticker: "TTF=F"
    source: "yfinance"
    mwh_per_unit: 1.0
  EUA:
    ticker: null
    source: "carbon_ets"
    mwh_per_unit: null
  DE_POWER:
    ticker: null
    bidding_zone: "DE_LU"
    source: "entsoe"
    mwh_per_unit: 1.0
  NO1_POWER:
    ticker: null
    bidding_zone: "NO_1"
    source: "entsoe"
    mwh_per_unit: 1.0
  RBOB:
    ticker: "RB=F"
    source: "yfinance"
    mwh_per_unit: null
  GASOIL:
    ticker: "GOC=F"
    source: "yfinance"
    mwh_per_unit: null
  API2:
    ticker: "MTF=F"
    source: "yfinance"
    # API2 CIF ARA is quoted against a 6,000 kcal/kg NAR specification:
    # 6,000 kcal/kg = 6.978 MWh/tonne. (8.141 MWh/t would be tonne-of-coal-
    # equivalent at 7,000 kcal/kg, which is not the API2 contract spec.)
    mwh_per_unit: 6.978
  EURUSD:
    ticker: "EURUSD=X"
    source: "yfinance"
    mwh_per_unit: null

spreads:
  spark:
    efficiency: 0.55
    emission_factor: 0.37
  dark:
    efficiency: 0.38
    emission_factor: 0.90
  crack:
    ratio: [2, 1, 3]
    # Legs are quoted in different units and must be converted to USD/bbl
    # before the 2:1:3 ratio is applied.
    rbob_gal_per_bbl: 42.0        # RBOB USD/gal x 42 -> USD/bbl
    gasoil_bbl_per_tonne: 7.45    # ICE Gasoil USD/tonne / 7.45 -> USD/bbl

risk:
  confidence: [0.95, 0.99]
  es_confidence: 0.975
  n_simulations: 10000
  dcc_p: 1
  dcc_q: 1
  # The FHS step draws from a t-copula, so an unseeded run reports a different
  # breach count each time. Fixing the seed here keeps the stored backtest table
  # reproducible and consistent with the figure quoted in the notebooks.
  seed: 42
  # Estimation window for the rolling VaR backtest. GARCH(1,1) with Student-t
  # errors has five parameters and the FHS step reads a 1-in-20 empirical
  # residual quantile, so a short window gives unstable volatility persistence
  # and a tail read off two or three points. Two trading years is the usual
  # desk choice and matches the Basel 250-day backtesting sample.
  rolling_window: 500
  # Day-ahead power clears negative when inflexible generation exceeds demand
  # (15 days for DE_LU in this sample, low of -53.87 EUR/MWh), so a plain log
  # return is undefined. A fixed displacement k keeps ln((P+k)/(P_prev+k))
  # well defined and reduces to the ordinary log return when P >> k.
  price_displacement_eur:
    DE_POWER: 100.0
    NO1_POWER: 100.0

portfolio:
  positions:
    BRENT: {notional_eur: 9200000, direction: "LONG"}
    CRACK_3_2_1: {notional_eur: -4600000, direction: "SHORT"}
    TTF: {notional_eur: 8000000, direction: "LONG"}
    SPARK_SPREAD: {notional_eur: -4000000, direction: "SHORT"}
    EUA: {notional_eur: 3000000, direction: "LONG"}
  # Spreads are traded as one instrument but risk-managed by their legs: the
  # delta of a spread is the sum of the deltas of its underlyings. Weights
  # multiply the spread notional to give each leg's signed EUR exposure.
  spread_legs:
    # 3-2-1 crack: 3 bbl crude in, 2 bbl gasoline + 1 bbl distillate out.
    # Short the crack = short the refining margin = long crude, short products.
    CRACK_3_2_1:
      BRENT: -1.0
      RBOB: 0.666667
      GASOIL: 0.333333
    # Spark spread = power - heat_rate x gas. Short the spark = short power,
    # long gas.
    SPARK_SPREAD:
      DE_POWER: 1.0
      TTF: -1.0

scenarios:
  gas_crisis:
    active: true
    description: "Nord Stream Zero"
    shocks:
      TTF: 3.00
      DE_POWER: 2.00
      EUA: 0.50
      BRENT: 0.30
      RBOB: 0.20
      GASOIL: 0.25
      API2: 1.00
  recession:
    active: true
    description: "Global Recession"
    shocks:
      BRENT: -0.40
      TTF: -0.30
      DE_POWER: -0.25
      EUA: -0.20
      RBOB: -0.45
      GASOIL: -0.40
      API2: -0.35
  energy_transition:
    active: true
    description: "Energy Transition Accelerates"
    shocks:
      EUA: 2.00
      API2: -0.40
      BRENT: -0.30
      DE_POWER: -0.10
      TTF: -0.20
      RBOB: -0.35
      GASOIL: -0.35
